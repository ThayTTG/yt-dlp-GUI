name: Build e Release

# Lança uma versão nova do YT-DLP GUI.
#
# Como disparar:
#   • enviar qualquer commit para o branch "release"  → a tag vem do <Version> do .csproj
#   • ou enviar uma tag no formato v1.2.3
#
# Gera dois pacotes, com nomes fixos (usados pelo site e pelo NokyLabs Launcher):
#   • YtDlpGui-win-x64.zip   → pelo publicar.ps1: YtDlpGui.exe + yt-dlp.exe, ffmpeg.exe e deno.exe
#   • YtDlpGui-linux-x64.zip → YtDlpGui + yt-dlp. O FFmpeg e o Deno o próprio app baixa na
#     primeira abertura (ou usa os do sistema, se já estiverem instalados), o que deixa o
#     pacote do Linux bem menor.
on:
  push:
    branches:
      - release
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true   # lib/NokyLabs.UI (o Kit NokyLabs)

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Testes (Linux)
        run: dotnet test tests/YtDlpGui.Tests -c Release

      - name: Publicar (linux-x64, arquivo único)
        run: >
          dotnet publish src/YtDlpGui/YtDlpGui.csproj -c Release -r linux-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -o pacote-linux

      - name: Incluir o yt-dlp oficial (conferido pelo SHA-256)
        run: |
          base=https://github.com/yt-dlp/yt-dlp/releases/latest/download
          curl -fsSL "$base/SHA2-256SUMS" -o SHA2-256SUMS
          curl -fsSL "$base/yt-dlp_linux" -o pacote-linux/yt-dlp
          esperado=$(awk '$2 == "yt-dlp_linux" {print $1}' SHA2-256SUMS)
          real=$(sha256sum pacote-linux/yt-dlp | cut -d' ' -f1)
          [ -n "$esperado" ] && [ "$esperado" = "$real" ] || { echo "::error::O yt-dlp_linux não passou na conferência do SHA-256."; exit 1; }

      - name: Montar o YtDlpGui-linux-x64.zip
        run: |
          cp src/YtDlpGui/filtro-conteudo.exemplo.json pacote-linux/ 2>/dev/null || true
          chmod +x pacote-linux/YtDlpGui pacote-linux/yt-dlp
          for f in YtDlpGui yt-dlp icon.ico; do [ -f "pacote-linux/$f" ] || { echo "::error::Faltou o $f no pacote."; exit 1; }; done
          # O zip guarda a permissão de execução (o launcher também confere ao instalar).
          cd pacote-linux && zip -9 -r ../YtDlpGui-linux-x64.zip . && cd ..
          sha256sum YtDlpGui-linux-x64.zip | cut -d' ' -f1 > YtDlpGui-linux-x64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            YtDlpGui-linux-x64.zip
            YtDlpGui-linux-x64.zip.sha256

  build-and-release:
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true   # lib/NokyLabs.UI (o Kit NokyLabs)

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Descobrir a versão
        id: versao
        shell: pwsh
        run: |
          [xml]$proj = Get-Content src/YtDlpGui/YtDlpGui.csproj
          $v = @($proj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          if ("${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" } else { $tag = "v$v" }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Conferir se a versão é nova
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.versao.outputs.tag }}"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "::error title=Versão já lançada::A versão $tag já existe. Aumente o <Version> no .csproj (ex.: 1.0.0 → 1.0.1) e envie de novo para o branch release."
            exit 1
          }
          Write-Host "A versão $tag é nova. Seguindo com o lançamento."
          exit 0

      - name: Notas da versão (CHANGELOG.md)
        id: notas
        shell: pwsh
        run: python .github/scripts/notas_da_versao.py ler "${{ steps.versao.outputs.tag }}" CHANGELOG.md

      - name: Testes
        run: dotnet test tests/YtDlpGui.Tests -c Release

      - name: Gerar o pacote (publicar.ps1)
        shell: pwsh
        run: ./src/YtDlpGui/publicar.ps1

      - name: Conferir e renomear
        shell: pwsh
        run: |
          foreach ($f in "YtDlpGui.exe", "yt-dlp.exe", "ffmpeg.exe", "deno.exe", "icon.ico") {
            if (-not (Test-Path "src\YtDlpGui\Distribuicao\$f")) { throw "Faltou o $f no pacote." }
          }
          Move-Item src\YtDlpGui\YtDlpGui-Portatil.zip YtDlpGui-win-x64.zip
          (Get-FileHash YtDlpGui-win-x64.zip -Algorithm SHA256).Hash | Out-File -Encoding ascii YtDlpGui-win-x64.zip.sha256

      - uses: actions/download-artifact@v4
        with:
          name: linux

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          name: YT-DLP GUI ${{ steps.versao.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            YtDlpGui-win-x64.zip
            YtDlpGui-win-x64.zip.sha256
            YtDlpGui-linux-x64.zip
            YtDlpGui-linux-x64.zip.sha256
          body: |
            ## YT-DLP GUI ${{ steps.versao.outputs.tag }}

            ### O que há de novo
            <!-- novidades -->
            ${{ steps.notas.outputs.texto }}
            <!-- /novidades -->

            Baixe vídeos e áudios colando um link, sem abrir o terminal. Feito para usar com a turma.

            **Como instalar no Windows**
            1. Baixe o `YtDlpGui-win-x64.zip` abaixo (ou instale pelo NokyLabs Launcher)
            2. Extraia a pasta inteira e abra o `YtDlpGui.exe`
            3. Se aparecer o aviso azul do Windows, clique em "Mais informações" › "Executar assim mesmo"

            Já vem com o yt-dlp, o ffmpeg e o Deno. Não precisa instalar o .NET.

            **Como instalar no Linux** (64 bits)
            1. Baixe o `YtDlpGui-linux-x64.zip` abaixo (ou instale pelo NokyLabs Launcher)
            2. Extraia numa pasta sua (ex.: `~/Apps/YtDlpGui`) e rode `./YtDlpGui`
            3. Na primeira abertura ele baixa sozinho o FFmpeg e o Deno (ou usa os do sistema, se já tiver)

            Mais detalhes: https://thayttg.github.io/nokylabs/#ytdlp-gui

      # Se as notas vieram da seção "Não lançado", ela vira a seção desta versão no CHANGELOG do main.
      - name: Registrar a versão no CHANGELOG
        if: steps.notas.outputs.promover == 'sim'
        shell: bash
        env:
          PRINCIPAL: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --depth 1 origin "$PRINCIPAL"
          git checkout -f -B registrar-changelog "origin/$PRINCIPAL"
          python .github/scripts/notas_da_versao.py promover "${{ steps.versao.outputs.tag }}" CHANGELOG.md
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "CHANGELOG: versão ${{ steps.versao.outputs.tag }}"
          git push origin "HEAD:$PRINCIPAL" || echo "::warning::Não consegui registrar a versão no CHANGELOG; ajuste à mão."
