name: Sugerir uma ideia
description: Uma melhoria ou recurso novo para o YT-DLP GUI
title: "[Ideia] "
body:
  - type: textarea
    id: ideia
    attributes:
      label: Qual é a ideia?
      placeholder: O que você gostaria que o YT-DLP GUI fizesse?
    validations:
      required: true
  - type: textarea
    id: porque
    attributes:
      label: Para que ela ajudaria?
      placeholder: Conte a situação em que você sentiu falta disso.
